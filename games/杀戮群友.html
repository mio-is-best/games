  /* 联网后端地址：同源默认 /api(由 server/index.js 同源托管)；

<script>
/* ===== net_storage_shim.js (联网存储垫片，接管 localStorage，不改任何游戏逻辑) ===== */
/* =====================================================================
 * 联网存储垫片 (Networked Storage Shim)
 * 作用：透明拦截 window.localStorage，把账号与存档读写转发到后端，
 *       实现跨设备联网登录。bundle 内部 ks/bs 及直接 localStorage 调用
 *       完全无感 —— 本垫片不改任何游戏逻辑，只在存储层做网络代理。
 *
 * 设计要点：
 *  - cache：内存缓存，保证 bundle 的同步读取立即返回。
 *  - REAL：原始 localStorage（未覆盖），仅用于保存 _net_token / _net_user 会话，
 *          以及离线回退。
 *  - 账号表 user_accounts 走服务端专属接口(/api/accounts、/api/register、/api/login、
 *    /api/account)，由服务端持有真相；其余键(user_data_*、last_logged_in_user、UI 偏好)
 *    走 /api/kv 命名空间(按当前登录用户隔离)。
 *  - 离线/后端不可达时静默回退到 REAL localStorage，游戏仍可单机运行。
 * ===================================================================== */
(function () {
  const NET_API = window.NET_API || "/api"; // 可配：同源填 /api；跨域填完整后端地址
  const TOKEN_KEY = "_net_token";
  const USER_KEY = "_net_user";
  const REAL = window.localStorage; // 原始 localStorage，捕获一次

  const cache = new Map(); // key -> string
  const pending = new Map(); // key -> 待推送的 setTimeout
  let online = true;
  let booted = false;

  function getToken() {
    try { return REAL.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  }
  function setToken(t) {
    try { if (t) REAL.setItem(TOKEN_KEY, t); else REAL.removeItem(TOKEN_KEY); } catch (e) {}
  }
  function getCurUser() {
    try { return REAL.getItem(USER_KEY) || ""; } catch (e) { return ""; }
  }
  function setCurUser(u) {
    try { if (u) REAL.setItem(USER_KEY, u); else REAL.removeItem(USER_KEY); } catch (e) {}
  }

  function log(...a) { if (window.NET_DEBUG) console.log("[NetStorage]", ...a); }

  // 网络请求封装：失败静默(离线回退)，不抛异常阻断游戏
  async function api(method, path, body, useToken) {
    if (!online) return null;
    try {
      const headers = { "Content-Type": "application/json" };
      if (useToken) {
        const t = getToken();
        if (t) headers["Authorization"] = "Bearer " + t;
      }
      const res = await fetch(NET_API + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      log("api", method, NET_API + path, "->", res.status);
      if (res.status === 401 || res.status === 403) {
        // token 失效：清掉，后续按需重新登录
        if (useToken) { setToken(""); setCurUser(""); }
        return null;
      }
      if (!res.ok) return null;
      return await res.json();
    } catch (e) {
      online = false; // 标记离线，避免后续请求空转
      log("网络不可达，进入离线回退:", e.message);
      return null;
    }
  }

  // 拉取该用户全部 KV 灌入缓存(拿到 token 后立刻做，保证登录后同步读取命中)
  async function pullAll() {
    const r = await api("GET", "/bootstrap", null, true);
    if (r && r.ok) {
      writeCache("user_accounts", r.accounts || {});
      const data = r.data || {};
      for (const k of Object.keys(data)) writeCache(k, data[k]);
      log("pullAll 完成，键数:", Object.keys(data).length);
    }
  }

  // 确保已拿到 token：用缓存中的 user_accounts[用户名].password 调登录
  async function ensureToken(username) {
    if (getToken()) { await pullAll(); return true; }
    if (!username) return false;
    const acc = readCacheJSON("user_accounts");
    const pwd = acc && acc[username] && acc[username].password;
    if (!pwd) return false;
    const r = await api("POST", "/login", { username, password: pwd }, false);
    if (r && r.ok) {
      setToken(r.token);
      setCurUser(username);
      log("自动获取 token 成功:", username);
      await pullAll();
      return true;
    }
    return false;
  }

  function readCacheJSON(key) {
    const s = cache.get(key);
    if (s == null) return null;
    try { return JSON.parse(s); } catch (e) { return null; }
  }
  function writeCache(key, value) {
    cache.set(key, typeof value === "string" ? value : JSON.stringify(value));
  }

  // 把 user_accounts 的变更同步到服务端(注册/改密)，并拿回 token
  // oldMap 必须是“覆盖缓存之前”的旧值快照，否则 new===old 会误判为无变更
  async function syncAccounts(newMap, oldMap) {
    if (!oldMap) oldMap = readCacheJSON("user_accounts") || {};
    writeCache("user_accounts", newMap);
    // 找出新增或修改的账号
    for (const u of Object.keys(newMap)) {
      const np = newMap[u] && newMap[u].password;
      const op = oldMap[u] && oldMap[u].password;
      if (np == null) continue;
      if (op === np) continue; // 未变
      if (op == null) {
        // 新账号 -> 注册
        const r = await api("POST", "/register", { username: u, password: np }, false);
        if (r && r.ok) { setToken(r.token); setCurUser(u); log("注册成功:", u); await pullAll(); }
      } else {
        // 改密码
        const r = await api("PUT", "/account", { username: u, oldPassword: op, newPassword: np }, false);
        if (r && r.ok) { setToken(r.token); setCurUser(u); log("改密成功:", u); await pullAll(); }
      }
    }
    if (!getToken()) {
      // 没有新增/改动，但可能需要登录(例如仅切换 last_logged_in_user)
      const cur = (readCacheJSON("last_logged_in_user") || {}).username;
      if (cur) await ensureToken(cur);
    }
  }

  // 推送一个 KV 键(防抖)
  function pushKV(key, value) {
    if (pending.has(key)) clearTimeout(pending.get(key));
    pending.set(key, setTimeout(async () => {
      pending.delete(key);
      const ok = await ensureToken(getCurUser() || (readCacheJSON("last_logged_in_user") || {}).username);
      if (!ok) { REAL.setItem(key, value); return; } // 离线/无凭证 -> 仅本地
      const r = await api("PUT", "/kv/" + encodeURIComponent(key), { value }, true);
      if (!r || !r.ok) REAL.setItem(key, value); // 失败回退本地
    }, 200));
  }

  // ---------- 启动预拉取：新设备/刷新时把服务端数据灌入缓存 ----------
  window.__netBootstrap = async function () {
    if (booted) return;
    booted = true;
    const token = getToken();
    if (!token) {
      // 无 token：仍尝试拉取账号表(user_accounts 公开可读，供登录校验)
      const r = await api("GET", "/accounts", null, false);
      if (r && r.ok) writeCache("user_accounts", r.accounts || {});
      return;
    }
    const r = await api("GET", "/bootstrap", null, true);
    if (r && r.ok) {
      writeCache("user_accounts", r.accounts || {});
      const data = r.data || {};
      for (const k of Object.keys(data)) writeCache(k, data[k]);
      log("bootstrap 完成，载入键数:", Object.keys(data).length);
    } else {
      // token 失效，回退：尝试拉账号表
      const a = await api("GET", "/accounts", null, false);
      if (a && a.ok) writeCache("user_accounts", a.accounts || {});
    }
  };

  // ---------- 覆盖 window.localStorage ----------
  const shim = {
    get length() { return cache.size; },
    key(i) { return Array.from(cache.keys())[i] || null; },
    getItem(key) {
      key = String(key);
      if (cache.has(key)) return cache.get(key);
      // 缓存未命中：尝试回源(同步无法 await，这里返回本地/空，网络补齐在后台)
      const local = safeReal(key);
      if (local != null) { writeCache(key, local); }
      // 后台补齐 user_accounts / 当前用户数据
      if (key === "user_accounts") {
        api("GET", "/accounts", null, false).then((r) => {
          if (r && r.ok) writeCache("user_accounts", r.accounts || {});
        });
      } else if (getToken()) {
        api("GET", "/kv/" + encodeURIComponent(key), null, true).then((r) => {
          if (r && r.ok && r.value != null) writeCache(key, typeof r.value === "string" ? r.value : JSON.stringify(r.value));
        });
      }
      return cache.has(key) ? cache.get(key) : (local != null ? local : null);
    },
    setItem(key, value) {
      key = String(key);
      const v = String(value);
      const prev = cache.has(key) ? cache.get(key) : null; // 先快照旧值，再覆盖
      writeCache(key, v);
      safeRealSet(key, v);
      if (key === "user_accounts") {
        let oldMap = {};
        if (prev != null) { try { oldMap = JSON.parse(prev); } catch (e) {} }
        syncAccounts(readCacheJSON("user_accounts") || {}, oldMap);
      } else if (key === "last_logged_in_user") {
        const u = (readCacheJSON("last_logged_in_user") || {}).username;
        if (u) {
          ensureToken(u).then((ok) => {
            if (ok) pushKV(key, v);
            else safeRealSet(key, v);
          });
        } else {
          // 登出
          setToken(""); setCurUser("");
          api("POST", "/logout", {}, true);
          safeRealSet(key, v);
        }
      } else {
        pushKV(key, v);
      }
    },
    removeItem(key) {
      key = String(key);
      cache.delete(key);
      safeRealRemove(key);
      if (key !== "user_accounts" && getToken()) {
        api("DELETE", "/kv/" + encodeURIComponent(key), null, true);
      }
    },
    clear() {
      cache.clear();
      try { REAL.clear(); } catch (e) {}
    },
  };
  function safeReal(k) { try { return REAL.getItem(k); } catch (e) { return null; } }
  function safeRealSet(k, v) { try { REAL.setItem(k, v); } catch (e) {} }
  function safeRealRemove(k) { try { REAL.removeItem(k); } catch (e) {} }

  try {
    Object.defineProperty(window, "localStorage", { value: shim, configurable: true });
    log("localStorage 已接管为联网存储垫片");
  } catch (e) {
    console.error("[NetStorage] 无法覆盖 localStorage，退回原生:", e);
  }

  // 周期性探测恢复在线状态
  setInterval(() => { if (!online) online = true; }, 15000);
})();

</script>
